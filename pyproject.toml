[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceresearch"
version = "0.1.0"
description = "CLI-first Deep Research multi-agent MVP with evidence grounding and trace artifacts."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
traceresearch = "traceresearch.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not llm_smoke'"
markers = [
    "llm_smoke: tests that require a real LLM provider (manual only, not in CI)",
]

[tool.setuptools.packages.find]
include = ["traceresearch*"]
